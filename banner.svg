<svg width="900" height="190" viewBox="0 0 900 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0f1d45"/>
      <stop offset="100%" stop-color="#0b3b5b"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.20"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="900" height="190" rx="16" fill="url(#bg)"/>
  <rect width="900" height="190" rx="16" fill="url(#dots)"/>

  <!-- Animated soft cyber wave -->
  <path fill="url(#wave1)" d="M0,145 Q225,110 450,145 T900,145 L900,190 L0,190 Z">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0,145 Q225,110 450,145 T900,145 L900,190 L0,190 Z;
              M0,150 Q225,175 450,140 T900,150 L900,190 L0,190 Z;
              M0,145 Q225,110 450,145 T900,145 L900,190 L0,190 Z"/>
  </path>

  <!-- Subtle glowing accent line -->
  <rect x="330" y="34" width="240" height="24" rx="12" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.4"/>
  <text x="450" y="50" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" letter-spacing="1.2">
    ● AI AGENT LAB · WUHAN
  </text>

  <!-- Main Name -->
  <text x="450" y="106" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="44" font-weight="800" letter-spacing="1.5">
    He Jianwei · supumi
  </text>

  <!-- Subtitle -->
  <text x="450" y="142" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="500" letter-spacing="0.8">
    Foreign Trade × AI Agent Builder  |  Vibe Coding &amp; Edge AI
  </text>
</svg>
